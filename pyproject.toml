[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "at2_weather"
version = "0.0.1"
description = "AT2 - Machine Learning as a Service - Weather Intelligence Experimentation"
authors = [
  { name = "Vignesh Selvam" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "jupyterlab==4.6.1",
    "matplotlib>=3.11.1",
    "mykrml-25740287>=0.2.0",
    "pandas==2.2.3",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["at2_weather"]
include = ["pyproject.toml", "at2_weather/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["at2_weather"]
force-sort-within-sections = true

